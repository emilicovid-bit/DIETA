<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Plan Nutricional DO PROCEL</title>
<style>
/* Layout: barra superior con paciente activo + pestañas; cada pestaña es una hoja de trabajo; "Plan" es la hoja imprimible A4 */
:root{
  --bg:#eef2f5; --panel:#ffffff; --ink:#14213a; --muted:#5a6878; --line:#d5dee6;
  --accent:#1f6f8f; --accent-ink:#ffffff; --accent-soft:#dcedf4; --drop:#c8321f;
  --ok:#2f8a4e; --ok-soft:#dcf0e2; --warn:#b7791f; --warn-soft:#fbefd6; --bad:#c2412d; --bad-soft:#f9dfd9;
  --g-cer:#d89b2b; --g-leg:#8a5a3b; --g-ver:#3f9152; --g-fru:#e0663f; --g-lac:#4c8fc9; --g-pro:#b23a48; --g-gra:#e3c22f; --g-gp:#a77b2c;
  --f-display:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1720; --panel:#16212d; --ink:#e4ecf3; --muted:#94a4b5; --line:#2a3a4b;
  --accent:#5fb6d8; --accent-ink:#06202c; --accent-soft:#1a3646;
  --ok:#5cc07c; --ok-soft:#1c3a26; --warn:#e2a64a; --warn-soft:#3d2f17; --bad:#ec7a64; --bad-soft:#40221c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1720; --panel:#16212d; --ink:#e4ecf3; --muted:#94a4b5; --line:#2a3a4b;
  --accent:#5fb6d8; --accent-ink:#06202c; --accent-soft:#1a3646;
  --ok:#5cc07c; --ok-soft:#1c3a26; --warn:#e2a64a; --warn-soft:#3d2f17; --bad:#ec7a64; --bad-soft:#40221c;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
h2{font-size:1.35rem} h3{font-size:1.05rem}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;line-height:1.1;margin-right:auto}.brand>div{display:flex;flex-direction:column}.brand-logo{height:34px;width:auto}
.brand b{font-family:var(--f-display);font-size:1.2rem;letter-spacing:.12em}
.brand span{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pac{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;font:inherit;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
main{padding-block:18px 48px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h3{margin-bottom:10px}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.sub{color:var(--muted);font-size:.82rem}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.ex-banner{background:var(--warn-soft);color:var(--ink);border:1px dashed var(--warn);border-radius:var(--r);padding:8px 12px;font-size:.85rem;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
textarea{min-height:58px;resize:vertical}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:3px 8px;font-size:.8rem}
.btn.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:0 6px}
.btn.x:hover{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.days button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.st{width:8px;height:8px;border-radius:50%;display:inline-block}
.st.ok{background:var(--ok)} .st.warn{background:var(--warn)} .st.bad{background:var(--bad)} .st.none{background:var(--line)}
.menu-layout{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:900px){.menu-layout{grid-template-columns:minmax(0,1fr)}}
.meal{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.meal:first-child{border-top:0;margin-top:0;padding-top:0}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.item{display:grid;grid-template-columns:10px minmax(120px,1fr) minmax(150px,1.6fr) 70px minmax(110px,1fr) 26px;gap:6px;align-items:center;margin-bottom:5px}
.item .bar-g{width:10px;align-self:stretch;border-radius:3px}
.item .cas{font-size:.78rem;color:var(--muted)}
@media (max-width:640px){.item{grid-template-columns:8px 1fr 70px 26px}.item .sel-g{grid-column:2/5}.item .sel-f{grid-column:2/3}.item .cas{grid-column:2/5}.item .bar-g{grid-row:span 3}}
.bal{display:grid;gap:7px}
.bal-r{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.82rem}
.track{grid-column:1/3;height:8px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden;border:1px solid var(--line)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:4px}
.mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.wk td.c{text-align:center;font-variant-numeric:tabular-nums;font-size:.8rem}
.c-ok{background:var(--ok-soft)} .c-warn{background:var(--warn-soft)} .c-bad{background:var(--bad-soft)}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line)}
.chk.done span{text-decoration:line-through;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.note{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:.85rem;z-index:20}
/* ===== Hoja imprimible ===== */
.sheet{background:#fff;color:#16252a;max-width:820px;margin:0 auto;padding:28px 30px;border:1px solid var(--line);border-radius:4px;font-size:12px}
.sheet h1{font-family:var(--f-display);font-size:20px;letter-spacing:.14em}
.sheet .mh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #3d9cc0;padding-bottom:10px;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.sheet .mh .doc b{font-family:var(--f-display);font-size:15px}
.sheet .mh small{color:#5b6f74;display:block}
.sheet h4{font-family:var(--f-display);font-size:13px;margin:14px 0 6px;color:#1f6f8f;text-transform:uppercase;letter-spacing:.08em}
.sheet table{font-size:10.5px}
.sheet th{color:#5b6f74} .sheet td,.sheet th{border-color:#d3dfdd;padding:4px 5px;vertical-align:top}
.sheet .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 14px}
.sheet .firma{margin-top:34px;display:flex;justify-content:flex-end}

.ig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;align-items:start}
.ig{border:1px solid #d5dee6;border-radius:6px;padding:10px;break-inside:avoid;page-break-inside:avoid}
.ig-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.ig-t{font-family:var(--f-display);font-weight:600;font-size:13px;border-bottom:3px solid;padding-bottom:2px;display:inline-block}
.ig-n{font-size:11.5px;margin-top:3px}
.ig-tip{font-size:10.5px;color:#5a6878;margin-bottom:6px}
.ig table td{padding:3px 2px;border-color:#e6ecf1}
.ig-f{font-size:10px;color:#5a6878;margin-top:4px;text-align:right}
.sheet .ig-rep td,.sheet .ig-rep th{padding:4px 6px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff} body::before{display:none}
  header.top,.noprint,.ex-banner{display:none!important}
  main{padding:0} .wrap{padding:0;max-width:none}
  .sheet{border:0;padding:0;max-width:none}
  .sheet table{page-break-inside:auto} .sheet tr{page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

// IMC = peso (kg) / talla (m)²
const imc = (peso,tallaCm) => (peso>0&&tallaCm>0) ? peso/((tallaCm/100)**2) : null;
// Clasificación: OMS en adultos <65 años; OPS/SABE (Lipschitz) en ≥65 años
function clasifImc(v,edad){
  if(v==null) return ['—','p-acc'];
  if(edad>=65){
    if(v<23) return ['Bajo peso (OPS ≥65)','p-warn'];
    if(v<28) return ['Normal (OPS ≥65)','p-ok'];
    if(v<32) return ['Sobrepeso (OPS ≥65)','p-warn'];
    return ['Obesidad (OPS ≥65)','p-bad'];
  }
  if(v<18.5) return ['Bajo peso','p-warn']; if(v<25) return ['Normopeso','p-ok']; if(v<30) return ['Sobrepeso','p-warn'];
  if(v<35) return ['Obesidad grado I','p-bad']; if(v<40) return ['Obesidad grado II','p-bad']; return ['Obesidad grado III','p-bad'];
}

function mifflin(d){
  const {peso,talla,edad,sexo}=d; if(!(peso>0&&talla>0&&edad>0)) return null;
  return 10*peso + 6.25*talla - 5*edad + (sexo==='H'?5:-161);
}
function gastoTotal(d){ const b=mifflin(d); return b ? b*(+d.actividad||1.2) : null; }

function sugerirMetas(kcal){
  const base={cer:6,leg:1,ver:4,fru:3,lac:2,pro:6,gra:4,gp:1};
  const f=kcal/1590, m={};
  GK.forEach(g=>{ m[g]=Math.round(base[g]*f*2)/2; });
  m.ver=Math.max(4,m.ver); m.leg=Math.max(1,m.leg); return m;
}

/* ---------- Cálculos del menú ---------- */
function totalesDia(p,d){
  const t={kcal:0,c:0,pr:0,g:0}; GK.forEach(g=>t[g]=0);
  const dia=p.menu[d]||{};
  TIEMPOS.forEach(([k])=>{ if(!p.datos.tiempos[k]) return; (dia[k]||[]).forEach(it=>{ const a=AL[it.f]; if(!a) return; const G=GRUPOS[a.g], n=+it.n||0;
    t[a.g]+=n; t.kcal+=G.k*n; t.c+=G.c*n; t.pr+=G.p*n; t.g+=G.g*n; }); });
  return t;
}
// Estado de equilibrio de un grupo: diferencia dentro de ±0,5 = ok; falta = warn; exceso >1 = bad
function estadoGrupo(act,meta){ const d=act-meta; if(Math.abs(d)<=0.5) return 'ok'; if(d<0) return 'warn'; return d>1?'bad':'warn'; }
function estadoDia(p,d){
  const t=totalesDia(p,d); if(t.kcal===0) return 'none';
  const es=GK.map(g=>estadoGrupo(t[g],+p.metas[g]||0));
  return es.includes('bad')?'bad':es.includes('warn')?'warn':'ok';
}
function listaMercado(p){
  const m={};
  for(let d=0;d<7;d++){ const dia=p.menu[d]||{}; TIEMPOS.forEach(([k])=>{ if(!p.datos.tiempos[k]) return; (dia[k]||[]).forEach(it=>{ if(!AL[it.f]) return; m[it.f]=(m[it.f]||0)+(+it.n||0); }); }); }
  const per=Math.max(1,+p.datos.personas||1);
  return Object.entries(m).map(([f,n])=>({a:AL[f],n,gr:n*AL[f].gr*per})).sort((x,y)=>GK.indexOf(x.a.g)-GK.indexOf(y.a.g)||x.a.n.localeCompare(y.a.n));
}
function usoSemanal(p){ const u={}; for(let d=0;d<7;d++){ const dia=p.menu[d]||{}; const vistos=new Set(); Object.values(dia).flat().forEach(it=>vistos.add(it.f)); vistos.forEach(f=>u[f]=(u[f]||0)+1); } return u; }

/* ============================================================
   PLANIFICACIÓN AUTOMÁTICA
   Reparte las metas diarias por tiempo de comida, elige alimentos
   aptos para cada comida, excluye lo que no come, prioriza lo que
   prefiere y, en diabetes (E10–E14), baja la prioridad a alimentos
   de mayor carga glucémica. En modo "práctica" repite almuerzo y
   merienda en bloques (L–X, J–S, D) para cocinar una vez.
   ============================================================ */
// Peso relativo de cada grupo en cada tiempo de comida
const PESOS = {
  cer:{desayuno:2,mm:0,almuerzo:2.5,mt:0.6,merienda:1.5}, leg:{almuerzo:1},
  ver:{desayuno:0.3,almuerzo:2,merienda:1.8}, fru:{desayuno:1,mm:1,mt:1},
  lac:{desayuno:1,mm:0.7,mt:0.5,merienda:0.2}, pro:{desayuno:1,almuerzo:3,mt:0.4,merienda:2},
  gra:{desayuno:1,almuerzo:1.8,merienda:1.2}, gp:{desayuno:0.4,mm:1,mt:1}
};
// Alimentos aptos por tipo de comida (si un grupo no está, se aceptan todos los del grupo)
const APTOS = {
  desayuno:{cer:['avena','pan','mote','tortilla','verde','choclo','quinua'],lac:['leche','yogur','yogurgr','lpolvo'],pro:['huevo','queso','clara','pavo'],gra:['aguacate','aceite'],gp:['mmani','almendra','chia'],ver:['tomate','pepino','pimiento']},
  snack:{cer:['galleta','pan','tortilla','choclo'],lac:['yogur','yogurgr','leche'],pro:['queso','huevo','pavo'],gp:['mani','almendra','nuez','pepas','mmani'],ver:['pepino','tomate'],gra:['aguacate'],leg:['chocho']},
  almuerzo:{cer:['arroz','papa','quinua','maduro','arrozi','yuca','mote','fideo','verde','camote','choclo'],pro:['pollo','res','pescado','cerdo','atun','camaron','sardina','pavo'],gra:['aceite','aguacate'],lac:['yogur','leche'],gp:['pepas','almendra','chia']},
  merienda:{cer:['quinua','papa','camote','verde','arrozi','tortilla','choclo','pan'],pro:['pescado','pollo','atun','huevo','queso','pavo'],gra:['aceite','aguacate'],lac:['leche','yogur'],gp:['pepas','chia']}
};
const BAJO_DM = ['maduro','sandia','uva','yuca','fideo','melon','galleta'];
const CRUDAS = ['ensalada','tomate','pepino','pimiento'];
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const tokens = s => norm(s).split(/[,;\/\n]| y | e /).map(x=>x.trim()).filter(x=>x.length>=3);
function coincide(a,toks){ const nn=norm(a.n), w=norm(a.n.split(' ')[0]); return toks.some(t=>nn.includes(t)||(w.length>=4&&t.includes(w))); }
const esDM = p => /E1[0-4]/i.test(p.datos.dx||'');
function autoCfg(p){
  const nC=(p.datos.diasCocina||[]).filter(Boolean).length;
  p.auto=Object.assign({variedad:nC<=2?'practica':'alta',recalc:true,cocina:true,reco:true,seed:0},p.auto||{});
  return p.auto;
}
function kcalSugerida(d){ const get=gastoTotal(d); if(!get) return null; return Math.max(d.sexo==='H'?1500:1200, Math.round((get-(+d.deficit||0))/50)*50); }
// Reparto entero (en medias porciones) por mayor residuo
function repartir(units,w){
  const t=w.reduce((s,x)=>s+x,0), raw=w.map(x=>x/t*units), fl=raw.map(Math.floor);
  let r=units-fl.reduce((s,x)=>s+x,0);
  raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(r>0){ fl[i]++; r--; } });
  return fl;
}
function candidatos(g,k,ex,pref,dm){
  const tipo=(k==='mm'||k==='mt')?'snack':k, base=APTOS[tipo]?.[g];
  const pos=a=>{ if(!base) return 0; const i=base.indexOf(a.id); return i<0?99:i; };
  let L=alimentos().filter(a=>a.g===g&&(!base||base.includes(a.id)||a.custom)&&!coincide(a,ex));
  if(!L.length) L=alimentos().filter(a=>a.g===g&&!coincide(a,ex));
  const sc=a=>(coincide(a,pref)?-100:0)+(dm&&BAJO_DM.includes(a.id)?100:0)+(dm&&a.id==='arrozi'?-50:0);
  return L.sort((a,b)=>sc(a)-sc(b)||pos(a)-pos(b));
}
function elegir(p,g,k,n,d,seed,ex,pref,dm,dia){
  let L=candidatos(g,k,ex,pref,dm); if(!L.length) return [];
  const fijo=k==='almuerzo'||k==='merienda';
  const blk=(fijo&&p.auto.variedad==='practica')?[0,0,0,1,1,1,2][d]:d;
  const off={desayuno:0,mm:2,almuerzo:1,mt:5,merienda:3}[k]||0;
  const usados=new Set(Object.values(dia).flat().map(x=>x.f));
  const tomar=(lista,start)=>{ for(let t=0;t<lista.length;t++){ const a=lista[(start+t)%lista.length]; if(!usados.has(a.id)){ usados.add(a.id); return a; } } return lista[start%lista.length]; };
  const pr=L.filter(a=>coincide(a,pref)); if(pr.length) L=pr.concat(L);
  const st=blk+seed+(k==='almuerzo'?0:off);
  if(g==='ver'&&fijo&&n>=2){
    const out=[]; const ens=L.find(a=>a.id==='ensalada');
    if(ens){ out.push({f:'ensalada',n:1}); usados.add('ensalada'); }
    const coc=L.filter(a=>!CRUDAS.includes(a.id)); const a=tomar(coc.length?coc:L,st);
    out.push({f:a.id,n:ens?n-1:n}); return out;
  }
  if(g==='gra'&&fijo&&n>=2&&L.some(a=>a.id==='aceite')){ const otro=L.filter(a=>a.id!=='aceite'); usados.add('aceite'); return otro.length?[{f:'aceite',n:n-1},{f:tomar(otro,st).id,n:1}]:[{f:'aceite',n}]; }
  if(g==='cer'&&fijo&&n>=3){ const a1=tomar(L,st), a2=tomar(L,st+1); return a1.id===a2.id?[{f:a1.id,n}]:[{f:a1.id,n:n-1},{f:a2.id,n:1}]; }
  return [{f:tomar(L,st).id,n}];
}
function generarDia(p,d,seed){
  autoCfg(p);
  const act=TIEMPOS.filter(([k])=>p.datos.tiempos[k]).map(([k])=>k); const dia={}; act.forEach(k=>dia[k]=[]);
  if(!act.length) return dia;
  const ex=tokens(p.datos.noCome), pref=tokens(p.datos.prefiere), dm=esDM(p);
  GK.forEach(g=>{
    const units=Math.round((+p.metas[g]||0)*2); if(!units) return;
    let w=act.map(k=>PESOS[g][k]||0);
    if(w.every(x=>!x)){ const fb=act.includes('almuerzo')?'almuerzo':act.includes('merienda')?'merienda':act[0]; w=act.map(k=>k===fb?1:0); }
    const ent=Math.floor(units/2), rep=repartir(ent,w).map(x=>x*2);
    if(units%2){ const im=w.indexOf(Math.max(...w)); rep[im]+=1; }
    if(ent===0&&units%2===0) return;
    act.forEach((k,i)=>{ const n=rep[i]/2; if(n>0) dia[k].push(...elegir(p,g,k,n,d,seed,ex,pref,dm,dia)); });
  });
  return dia;
}
// Cocina de la semana a partir de almuerzos y meriendas
function cocinaAuto(p){
  const diasC=[0,1,2,3,4,5,6].filter(i=>p.datos.diasCocina[i]); if(!diasC.length) diasC.push(6);
  const per=Math.max(1,+p.datos.personas||1), noLote=['pan','tortilla','galleta','avena','huevo','clara','queso','atun','sardina','pavo',...CRUDAS];
  const mapa={};
  for(let u=0;u<7;u++) ['almuerzo','merienda'].forEach(k=>{ if(!p.datos.tiempos[k]) return; (p.menu[u]?.[k]||[]).forEach(it=>{ const a=AL[it.f]; if(!a||!['cer','leg','pro','ver'].includes(a.g)||noLote.includes(a.id)) return;
    let c=diasC[0],dist=9; diasC.forEach(x=>{ const dd=(u-x+7)%7; if(dd<dist){dist=dd;c=x;} });
    const key=a.id+'|'+c; mapa[key]=mapa[key]||{a,c,usos:0,cerca:0}; mapa[key].usos++; if(dist<=3) mapa[key].cerca++; }); });
  const min={leg:60,pro:45,cer:25,ver:25};
  return Object.values(mapa).sort((x,y)=>x.c-y.c||GK.indexOf(x.a.g)-GK.indexOf(y.a.g)).map(m=>{
    const ref=m.cerca*per, lej=(m.usos-m.cerca)*per;
    const guardar = lej? (p.datos.congelador?(ref?`Refrigerar ${ref} porc. · congelar ${lej} porc.`:`Congelar ${lej} porc.; pasar al refrigerador la noche anterior`):`Refrigerar ${ref} porc. · volver a cocinar ${lej} porc. a mitad de semana`) : `Refrigerar ${ref} porc. en tupper individuales`;
    return {id:uid(),prep:m.a.n,porciones:m.usos*per,tandas:1,min:min[m.a.g],dia:DIAS[m.c],guardar};
  });
}
// Recomendaciones según perfil
function recoAuto(p){
  const d=p.datos, L=[
    'Beber 2 litros de agua al día. Evitar colas, jugos (aunque sean naturales) y bebidas azucaradas.',
    'Servir en plato de 23 cm: mitad verduras, un cuarto proteína y un cuarto cereal o tubérculo.',
    'Respetar los horarios de comida y no saltar tiempos.',

  if(esDM(p)) L.push('Comer primero las verduras y la proteína, y al final el cereal. Si usa insulina o glibenclamida, no saltar colaciones y llevar siempre un caramelo o 3 cucharaditas de azúcar ante temblor, sudor frío o mareo.');
  if(+d.edad>=65) L.push('No reducir la proteína: conserva la masa muscular. Incluir proteína en las tres comidas principales.');
  if(d.comeFuera) L.push('Cuando coma fuera: una sola harina por plato, sin jugo y con la mitad del plato de ensalada.');
  if(!d.microondasTrabajo) L.push('Para llevar al trabajo, preferir preparaciones que se coman frías: ensalada de quinua, menestra fría, atún con verduras.');
  if(p.controles.some(c=>/fin de semana/i.test(c.dificultad||''))) L.push('Fin de semana: dejar planificado el menú del sábado y domingo; la comida familiar también se sirve en el plato de 23 cm.');
  return L.join('\n');
}
function generarSemana(p){
  const au=autoCfg(p);
  let notaProt='';
  if(au.recalc){ const k=kcalSugerida(p.datos); if(k){ p.kcalObj=k; p.metas=sugerirMetas(k); } }
  // ≥65 años: proteína mínima 1,0 g/kg (PROT-AGE/ESPEN); en IMC ≥30 se usa peso ajustado
  const dd=p.datos;
  if(+dd.edad>=65 && +dd.peso>0 && +dd.talla>0){
    const t2=(dd.talla/100)**2, pi=25*t2, pref=imc(dd.peso,dd.talla)>=30 ? pi+0.25*(dd.peso-pi) : +dd.peso;
    const actual=GK.reduce((s,g)=>s+GRUPOS[g].p*(+p.metas[g]||0),0), falta=pref*1.0-actual;
    if(falta>0){ const add=Math.ceil(falta/7*2)/2; p.metas.pro=(+p.metas.pro||0)+add; p.metas.cer=Math.max(3,(+p.metas.cer||0)-Math.round(add*55/70*2)/2); notaProt=` · proteína subida a ≥1,0 g/kg (${Math.round(pref)} kg de referencia)`; }
  }
  for(let d=0;d<7;d++) p.menu[d]=generarDia(p,d,au.seed);
  if(au.cocina) p.cocina=cocinaAuto(p);
  if(au.reco) p.reco=recoAuto(p);
  p.compras={};
  const ok=[0,1,2,3,4,5,6].filter(d=>estadoDia(p,d)==='ok').length;
  const ex=alimentos().filter(a=>coincide(a,tokens(p.datos.noCome))).map(a=>a.n);
  p.autoInfo=`Propuesta del ${fmtF(hoy())}: ${p.kcalObj} kcal · ${ok} de 7 días en equilibrio${ex.length?' · excluidos: '+ex.join(', '):''}${esDM(p)?' · criterios de diabetes aplicados':''}${notaProt}.`;
}

  const R=42,C=2*Math.PI*R,v=Math.max(0,Math.min(100,pct||0));
  return `<svg viewBox="0 0 110 110" width="118" height="118" role="img" aria-label="Cumplimiento ${Math.round(v)}%">
    <circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/>
    <circle cx="55" cy="55" r="${R}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 55 55)"/>
    <text x="55" y="61" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--ink)">${Math.round(v)}%</text></svg>`;
}
function barras(vals,labels,max,colorFn,unidad=''){
  const W=360,H=150,pl=28,pb=22,pt=10,bw=(W-pl-8)/Math.max(vals.length,1);
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  [0,.25,.5,.75,1].forEach(f=>{ const v=max*f, yy=y(v); s+=`<line x1="${pl}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pl-4}" y="${yy+3}" text-anchor="end">${Math.round(v)}${unidad}</text>`; });
  vals.forEach((v,i)=>{ const x=pl+i*bw+bw*.18, w=bw*.64; if(v==null||v==='') return;
    s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="2" fill="${colorFn(v)}"/>`;
    s+=`<text x="${x+w/2}" y="${H-7}" text-anchor="middle">${esc(labels[i])}</text>`; });
  return s+'</svg>';
}
function linea(vals,labels,unidad='kg'){
  const pts=vals.map((v,i)=>[i,+v]).filter(x=>x[1]>0); if(pts.length<2) return '<p class="note">Registra al menos dos controles para ver la tendencia.</p>';
  const W=360,H=150,pl=34,pr=10,pb=22,pt=12;
  const ys=pts.map(p=>p[1]); let lo=Math.floor(Math.min(...ys)-1), hi=Math.ceil(Math.max(...ys)+1);
  const x=i=>pl+(W-pl-pr)*(i/(vals.length-1||1)), y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4, yy=y(v); s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-4}" y="${yy+3}" text-anchor="end">${r1(v)}</text>`; }
  const d=pts.map((p,j)=>(j?'L':'M')+x(p[0])+' '+y(p[1])).join(' ');
  s+=`<path d="${d} L${x(pts.at(-1)[0])} ${y(lo)} L${x(pts[0][0])} ${y(lo)} Z" fill="var(--accent-soft)" opacity=".7"/>`;
  s+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>`;
  pts.forEach((p,j)=>{ s+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="${j===pts.length-1?4.5:3}" fill="var(--accent)"/>`; });
  labels.forEach((l,i)=>{ s+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${esc(l)}</text>`; });
  return s+'</svg>';
}

    <tr><td><b>kcal</b></td><td class="c">${p.kcalObj}</td>${DIAS.map((_,d)=>`<td class="c"><b>${Math.round(totalesDia(p,d).kcal)}</b></td>`).join('')}</tr></tbody></table></div></div>`;
},

/* ---------- LISTA DE MERCADO ---------- */
mercado(p){
  const L=listaMercado(p), per=Math.max(1,+p.datos.personas||1);
  const hechos=L.filter(x=>p.compras[x.a.id]).length;
  let html='', g0=null;
  L.forEach(x=>{ if(x.a.g!==g0){ if(g0) html+='</div>'; g0=x.a.g; html+=`<div class="card"><h3><span class="dot" style="background:var(--g-${g0})"></span>${GRUPOS[g0].n}</h3>`; }
    const kg=x.gr>=1000?`${r1(x.gr/1000)} kg`:`${Math.round(x.gr)} g`;
    html+=`<label class="chk ${p.compras[x.a.id]?'done':''}"><input type="checkbox" id="mk_${x.a.id}" data-bind="compras.${x.a.id}" data-rerender="1" ${p.compras[x.a.id]?'checked':''}><span style="flex:1">${esc(x.a.n)}</span><span class="num sub">${kg}</span></label>`; });
  if(g0) html+='</div>';
  return `
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div><h2>Lista de mercado</h2><div class="sub">Semana completa · para ${per} persona${per>1?'s':''} · ${hechos} de ${L.length} comprados</div></div>
    <button class="btn sm" data-act="limpiarCompras">Desmarcar todo</button></div>
  <div class="grid g3">${html||'<p class="note">Arma el menú semanal y la lista se genera sola.</p>'}</div>
  <p class="note" style="margin-top:10px">Cantidades en peso de porción servida (cocido cuando aplica) × número de personas. Para cereales y leguminosas secas, comprar aproximadamente la mitad del peso indicado.</p>`;
},

/* ---------- COCINA DE LA SEMANA ---------- */
cocina(p){
  const tot=p.cocina.reduce((s,c)=>s+(+c.min||0)*(+c.tandas||1),0), disp=+p.datos.tiempoCocina||0;
  const diasC=DIAS.filter((_,i)=>p.datos.diasCocina[i]);
  const rows=p.cocina.map((c,i)=>`<tr>
    <td><input id="ck_p_${c.id}" data-bind="cocina.${i}.prep" value="${esc(c.prep)}" aria-label="Preparación"></td>
    <td><input id="ck_n_${c.id}" type="number" min="1" data-bind="cocina.${i}.porciones" data-num="1" value="${c.porciones}" style="width:64px" aria-label="Porciones"></td>
    <td><input id="ck_t_${c.id}" type="number" min="1" data-bind="cocina.${i}.tandas" data-num="1" data-rerender="1" value="${c.tandas}" style="width:56px" aria-label="Tandas"></td>
    <td><input id="ck_m_${c.id}" type="number" min="0" step="5" data-bind="cocina.${i}.min" data-num="1" data-rerender="1" value="${c.min}" style="width:64px" aria-label="Minutos"></td>
    <td><select id="ck_d_${c.id}" data-bind="cocina.${i}.dia" aria-label="Día">${DIAS.map(n=>`<option ${n===c.dia?'selected':''}>${n}</option>`).join('')}</select></td>
    <td style="min-width:200px"><input id="ck_g_${c.id}" data-bind="cocina.${i}.guardar" value="${esc(c.guardar)}" aria-label="Porcionar y guardar"></td>
    <td><button class="btn x" data-act="delCocina" data-i="${i}" aria-label="Quitar">×</button></td></tr>`).join('');
  return `
  <div class="grid tiles" style="margin-bottom:14px">
    <div class="card"><div class="lbl">Días de cocina</div><div class="big" style="font-size:1.3rem">${diasC.join(', ')||'—'}</div><div class="sub">Se editan en Paciente</div></div>
    <div class="card"><div class="lbl">Tiempo disponible</div><div class="big">${disp} <small style="font-size:.9rem">min</small></div><div class="sub">${r1(disp/60)} horas</div></div>
    <div class="card"><div class="lbl">Tiempo planificado</div><div class="big">${tot} <small style="font-size:.9rem">min</small></div>
      <span class="pill ${tot<=disp?'p-ok':'p-bad'}">${tot<=disp?'Cabe en su tiempo':`Excede ${tot-disp} min`}</span></div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3>Preparaciones base</h3>
    <div class="row"><button class="btn sm" data-act="sugerirCocina">Sugerir desde el menú</button><button class="btn sm pri" data-act="addCocina">+ Preparación</button></div></div>
    <div class="tw"><table><thead><tr><th>Preparación</th><th>Porciones</th><th>Tandas</th><th>Min/tanda</th><th>Día</th><th>Porcionar y guardar</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    ${p.cocina.length?'':'<p class="note">Sin preparaciones. Usa “Sugerir desde el menú”.</p>'}
    <p class="note" style="margin-top:8px">${p.datos.congelador?'Tiene congelador: congelar lo que se consume de jueves en adelante.':'Sin congelador: planificar una segunda jornada de cocina a mitad de semana.'} ${p.datos.microondasTrabajo?'Puede recalentar en el trabajo.':'Sin microondas en el trabajo: preferir preparaciones que se coman frías (ensaladas de quinua, leguminosas).'}</p>
  </div>`;
},

/* ---------- INTERCAMBIOS ---------- */
intercambios(p){
  const q=(VIEWS._q||'').toLowerCase();
  const cards=GK.map(g=>{ const G=GRUPOS[g]; const items=alimentos().filter(a=>a.g===g&&(!q||a.n.toLowerCase().includes(q)));

    return `<div class="card"><h3><span class="dot" style="background:var(--g-${g})"></span>${G.n}</h3>
      <div class="sub" style="margin-bottom:6px">1 intercambio = ${G.k} kcal · HC ${G.c} g · P ${G.p} g · G ${G.g} g</div>
      <div class="tw"><table><thead><tr><th>Alimento</th><th>Porción</th><th class="n">g</th></tr></thead><tbody>
      ${items.map(a=>`<tr><td>${esc(a.n)}${a.custom?` <button class="btn x" data-act="delExtra" data-id="${a.id}" aria-label="Eliminar">×</button>`:''}</td><td>${esc(a.cas)}</td><td class="n">${a.gr}</td></tr>`).join('')}
      </tbody></table></div></div>`; }).join('');
  return `
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h2>Lista de intercambios</h2><div class="sub">Adaptada a alimentos de Ecuador · ref. SMAE 4.ª ed. y ADA</div></div>

    <button class="btn pri" data-act="addExtra" style="align-self:end">Añadir</button></div></div>

},

/* ---------- SEGUIMIENTO Y PAGOS ---------- */
seguimiento(p){
  const rows=p.controles.map((c,i)=>{ const prev=p.controles[i-1]; const dk=prev&&+c.peso&&+prev.peso?r1(c.peso-prev.peso):'';

    <td><input type="number" min="0" max="7" id="cs_d_${c.id}" data-bind="controles.${i}.dias" data-num="1" value="${c.dias}" style="width:56px" aria-label="Días cumplidos"></td>

    <td style="min-width:200px"><input id="cs_a_${c.id}" data-bind="controles.${i}.ajuste" value="${esc(c.ajuste)}" aria-label="Ajuste"></td>
    <td><button class="btn x" data-act="delControl" data-i="${i}" aria-label="Quitar">×</button></td></tr>`; }).join('');
  const pagado=p.pagos.abonos.reduce((s,a)=>s+(+a.monto||0),0), saldo=(+p.pagos.valor||0)-pagado;
  return `
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3>Controles</h3>
    <div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:6px">Próximo control<input type="date" id="prox" data-bind="proxControl" value="${p.proxControl}" style="width:auto"></label>
    <button class="btn sm pri" data-act="addControl">+ Control</button></div></div>
    <div class="tw"><table><thead><tr><th>#</th><th>Fecha</th><th>Peso kg</th><th class="n">Δ</th><th>Cintura</th><th>% grasa</th><th>Días /7</th><th>Dificultad</th><th>Ajuste realizado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>

    <p class="note" style="margin-top:8px">“Días /7” = días de la semana previa en que siguió el plan. Alimenta el cumplimiento del Resumen.</p></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Pagos del plan</h3>
      <div class="fields"><label class="f">Valor del plan (USD)<input type="number" id="pv" data-bind="pagos.valor" data-num="1" data-rerender="1" value="${p.pagos.valor}"></label></div>

      ${p.pagos.abonos.map((a,i)=>`<tr><td><input type="date" id="pa_f_${a.id}" data-bind="pagos.abonos.${i}.fecha" value="${a.fecha}"></td><td><input type="number" step="0.01" id="pa_m_${a.id}" data-bind="pagos.abonos.${i}.monto" data-num="1" data-rerender="1" value="${a.monto}" style="text-align:right"></td><td><button class="btn x" data-act="delAbono" data-i="${i}" aria-label="Quitar">×</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn sm" data-act="addAbono">+ Abono</button>
      <span>Pagado <b class="num">$${pagado.toFixed(2)}</b> · <span class="pill ${saldo>0?'p-warn':'p-ok'}">${saldo>0?`Saldo $${saldo.toFixed(2)}`:'Al día'}</span></span></div></div>
    <div class="card"><h3>Peso por control</h3>${linea(p.controles.map(c=>c.peso),p.controles.map((c,i)=>'C'+(i+1)))}</div>
  </div>`;
},

/* ---------- LISTA DE INTERCAMBIOS PARA EL PACIENTE (imprimible) ---------- */
listaInt(p){
  const d=p.datos, act=TIEMPOS.filter(([k])=>d.tiempos[k]);
  const esFile = location.protocol==='file:';
  // Reparto por tiempo de comida tomado del día elegido del menú
  const dia=p.menu[diaSel]||{};
  const rep=k=>{ const c={}; (dia[k]||[]).forEach(it=>{ const a=AL[it.f]; if(a) c[a.g]=(c[a.g]||0)+(+it.n||0); }); return c; };
  const reps=act.map(([k])=>rep(k));
  const grupos=GK.filter(g=>(+p.metas[g]||0)>0);
  const cards=grupos.map(g=>{ const G=GRUPOS[g];
    return `<div class="ig"><div class="ig-h">${ilus(g)}<div><div class="ig-t" style="border-color:var(--g-${g})">${G.n}</div>

    <div class="firma"><img src="${FIRMA}" alt="Firma y sello Dr. Manuel J. Procel G." style="width:230px;height:auto"></div>
  </div>`;
},

/* ---------- PLAN DEL PACIENTE (imprimible) ---------- */
plan(p){

    <div class="firma"><img src="${FIRMA}" alt="Firma y sello Dr. Manuel J. Procel G." style="width:250px;height:auto"></div>
  </div>`;
}
};

/* ---------- Cálculo en vivo en la pestaña Paciente ---------- */
function actualizarCalc(){
  const el=$('#calc'); if(!el) return; const p=P(), d=p.datos;
  const b=mifflin(d), get=gastoTotal(d), v=imc(d.peso,d.talla), [cl,clc]=clasifImc(v,+d.edad), cr=cinturaRiesgo(d.cintura,d.sexo);
  const obj=get?Math.max(d.sexo==='H'?1500:1200, Math.round((get-(+d.deficit||0))/50)*50):null;
  el.innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
    <div><div class="lbl">IMC</div><div class="big" style="font-size:1.4rem">${v?r1(v):'—'}</div><span class="pill ${clc}">${cl}</span></div>
    <div><div class="lbl">Cintura</div><div class="big" style="font-size:1.4rem">${d.cintura||'—'}</div>${cr==null?'':`<span class="pill ${cr?'p-bad':'p-ok'}">${cr?'Riesgo (ALAD)':'Sin riesgo'}</span>`}</div>
    <div><div class="lbl">GEB Mifflin</div><div class="big" style="font-size:1.4rem">${b?Math.round(b):'—'}</div><span class="sub">kcal/día</span></div>
    <div><div class="lbl">GET</div><div class="big" style="font-size:1.4rem">${get?Math.round(get):'—'}</div><span class="sub">× ${d.actividad}</span></div></div>
    ${obj?`<div class="row" style="margin-top:10px;justify-content:space-between;background:var(--accent-soft);padding:8px 10px;border-radius:6px">
      <span>Sugerido: <b class="num">${obj} kcal/día</b> (GET − ${d.deficit||0}; mínimo ${d.sexo==='H'?1500:1200})</span>
      <button class="btn sm pri" data-act="aplicarKcal" data-k="${obj}">Usar en el plan</button></div>`:''}
    <p class="note" style="margin-top:6px">Mifflin-St Jeor con peso actual (mejor precisión en obesidad, ADA/AND). Plan actual: ${p.kcalObj} kcal.</p>`;
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='buscaInt'){ VIEWS._q=t.value; const pos=t.selectionStart; render(); const n=$('#buscaInt'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(t.dataset.act==='setN'){ return; } // se procesa en change
  if(!t.dataset.bind || t.type==='checkbox' || t.tagName==='SELECT') return;
  bindValue(t);
  if(tab==='paciente') actualizarCalc();
});
document.addEventListener('change',e=>{
  const t=e.target, p=P();
  if(t.id==='selPac'){ S.actual=t.value; guardar(); render(); return; }
  if(t.id==='impFile'){ importar(t.files[0]); t.value=''; return; }
  if(t.id==='repDia'){ diaSel=+t.value; render(); return; }
  const a=t.dataset.act;
  if(a==='setG'||a==='setF'||a==='setN'){
    const it=p.menu[diaSel][t.dataset.m][+t.dataset.i];
    if(a==='setG'){ it.f=alimentos().find(x=>x.g===t.value).id; }
    if(a==='setF'){ it.f=t.value; }
    if(a==='setN'){ it.n=Math.max(0,+t.value||0); }
    guardar(); render(); return;
  }
  if(t.dataset.bind){ bindValue(t); if(tab==='paciente') actualizarCalc(); if(t.dataset.rerender||t.tagName==='SELECT'&&tab!=='paciente') render(); else if(t.type==='checkbox'&&tab!=='paciente') render(); }
});
function bindValue(t){
  const p=P(); let v;
  if(t.type==='checkbox') v=t.checked;
  else if(t.type==='number'||t.dataset.num) v=t.value===''?'':+t.value;
  else v=t.value;
  setPath(p,t.dataset.bind,v); guardar();
  if(t.dataset.bind==='datos.nombre'){ const o=$('#selPac').selectedOptions[0]; if(o) o.textContent=(v||'Sin nombre')+(p.ejemplo?' (ejemplo)':''); }
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab],[data-act]'); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); if(tab==='paciente') actualizarCalc(); window.scrollTo(0,0); return; }
  const a=b.dataset.act, p=P(), i=+b.dataset.i;
  if(['setG','setF','setN'].includes(a)) return;
  const acciones={
    nuevoPac(){ const n=pacienteVacio(); S.pacientes.push(n); S.actual=n.id; tab='paciente'; guardar(); render(); actualizarCalc(); toast('Paciente creado'); },
    borrarPac(){ $('#confirmBorrar').innerHTML=`<div class="row" style="margin-top:8px;justify-content:flex-end;background:var(--bad-soft);padding:8px;border-radius:6px"><span>¿Eliminar a ${esc(p.datos.nombre||'este paciente')} y todos sus datos?</span><button class="btn sm" data-act="cancelBorrar">Cancelar</button><button class="btn sm" data-act="okBorrar" style="color:var(--bad)">Eliminar</button></div>`; },
    cancelBorrar(){ $('#confirmBorrar').innerHTML=''; },
    okBorrar(){ S.pacientes=S.pacientes.filter(x=>x.id!==p.id); if(!S.pacientes.length){ const n=pacienteVacio(); S.pacientes.push(n); } S.actual=S.pacientes[0].id; tab='dashboard'; guardar(); render(); toast('Paciente eliminado'); },
    dia(){ diaSel=+b.dataset.d; render(); },
    genSemana(){
      const au=autoCfg(p), lleno=[0,1,2,3,4,5,6].some(d=>Object.values(p.menu[d]||{}).some(x=>x.length));
      if(lleno&&!b.dataset.ok){ $('#genConfirm').innerHTML=`<div class="row" style="margin-top:8px;background:var(--warn-soft);padding:8px;border-radius:6px"><span style="flex:1">Esto reemplaza el menú de toda la semana${au.cocina?', la cocina':''}${au.reco?' y las recomendaciones':''}${au.recalc?'; también recalcula kcal y metas':''}.</span><button class="btn sm" data-act="cancelGen">Cancelar</button><button class="btn sm pri" data-act="genSemana" data-ok="1">Reemplazar</button></div>`; return; }
      generarSemana(p); guardar(); render(); toast('Semana generada');
    },
    genOtra(){ autoCfg(p).seed++; generarSemana(p); guardar(); render(); toast('Nueva propuesta'); },
    genDia(){ autoCfg(p); p.menu[diaSel]=generarDia(p,diaSel,p.auto.seed+1+Math.floor(Math.random()*30)); guardar(); render(); toast(`${DIAS[diaSel]} rehecho`); },
    cancelGen(){ $('#genConfirm').innerHTML=''; },
    addItem(){ const m=b.dataset.m; p.menu[diaSel]=p.menu[diaSel]||{}; (p.menu[diaSel][m]=p.menu[diaSel][m]||[]).push({f:'arroz',n:1}); guardar(); render(); },
    delItem(){ p.menu[diaSel][b.dataset.m].splice(i,1); guardar(); render(); },
    copiarDia(){ const dest=$('#copiaA').value, src=JSON.stringify(p.menu[diaSel]||{}); const ds=dest==='all'?[0,1,2,3,4,5,6].filter(x=>x!==diaSel):[+dest]; ds.forEach(x=>p.menu[x]=JSON.parse(src)); guardar(); render(); toast(`${DIAS[diaSel]} copiado`); },
    limpiarDia(){ p.menu[diaSel]={}; guardar(); render(); },
    sugerir(){ p.metas=sugerirMetas(+p.kcalObj||1600); guardar(); render(); toast('Metas recalculadas'); },
    aplicarKcal(){ p.kcalObj=+b.dataset.k; p.metas=sugerirMetas(p.kcalObj); guardar(); actualizarCalc(); toast(`Plan ajustado a ${p.kcalObj} kcal`); },
    limpiarCompras(){ p.compras={}; guardar(); render(); },
    addCocina(){ p.cocina.push({id:uid(),prep:'',porciones:4,tandas:1,min:30,dia:DIAS[p.datos.diasCocina.indexOf(true)]||'Domingo',guardar:''}); guardar(); render(); },
    delCocina(){ p.cocina.splice(i,1); guardar(); render(); },
    sugerirCocina(){ const u=usoSemanal(p), dia=DIAS[p.datos.diasCocina.indexOf(true)]||'Domingo', per=Math.max(1,+p.datos.personas||1);
      const ya=new Set(p.cocina.map(c=>c.prep.toLowerCase())); let n=0;
      Object.entries(u).filter(([f,c])=>c>=2&&['cer','leg','pro','ver'].includes(AL[f]?.g)&&!['pan','tortilla','galleta','avena','huevo','clara','queso','atun','sardina','ensalada','tomate','pepino','pimiento'].includes(f))
        .forEach(([f,c])=>{ const a=AL[f]; if(ya.has(a.n.toLowerCase())) return; n++;
          p.cocina.push({id:uid(),prep:a.n,porciones:c*per,tandas:1,min:a.g==='leg'?60:a.g==='pro'?45:a.g==='ver'?25:25,dia,
            guardar:p.datos.congelador&&c>3?`Refrigerar ${Math.ceil(c/2)*per} porc. · congelar ${Math.floor(c/2)*per}`:'Refrigerar en tupper individuales'}); });
      guardar(); render(); toast(n?`${n} preparaciones añadidas`:'No hay preparaciones nuevas que sugerir'); },
    addExtra(){ const n=$('#nx_n').value.trim(), c=$('#nx_c').value.trim(), gr=+$('#nx_gr').value; if(!n||!c||!gr){ toast('Completa nombre, porción y gramos'); return; }
      S.extra=S.extra||[]; S.extra.push({id:'x'+uid(),g:$('#nx_g').value,n,cas:c,gr,custom:true}); guardar(); render(); toast('Alimento añadido'); },
    delExtra(){ S.extra=S.extra.filter(x=>x.id!==b.dataset.id); guardar(); render(); },
    addControl(){ const u=p.controles.at(-1); p.controles.push({id:uid(),fecha:hoy(),peso:u?.peso||p.datos.peso||'',cintura:u?.cintura||'',grasa:'',dias:'',dificultad:'',ajuste:''}); p.proxControl=addDays(hoy(),14); guardar(); render(); },
    delControl(){ p.controles.splice(i,1); guardar(); render(); },
    addAbono(){ p.pagos.abonos.push({id:uid(),fecha:hoy(),monto:0}); guardar(); render(); },
    delAbono(){ p.pagos.abonos.splice(i,1); guardar(); render(); },
    imprimir(){ window.print(); },
    exportar(){ exportar(); }
  };
  acciones[a]?.();
});

/* ---------- Respaldo ---------- */
function exportar(){
  const json=JSON.stringify(S,null,1);
  if(location.protocol==='file:'){
    const blob=new Blob([json],{type:'application/json'}), url=URL.createObjectURL(blob), aEl=document.createElement('a');
    aEl.href=url; aEl.download=`respaldo-plan-nutricional-${hoy()}.json`; document.body.appendChild(aEl); aEl.click(); aEl.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Respaldo descargado');
  } else {
    navigator.clipboard?.writeText(json).then(()=>toast('Respaldo copiado. Pégalo en un archivo .json'),()=>toast('No se pudo copiar el respaldo'));
  }
}
function importar(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.pacientes?.length) throw 0; S=s; guardar(); render(); toast(`Restaurados ${s.pacientes.length} pacientes`); }catch(e){ toast('El archivo no es un respaldo válido de esta herramienta'); } };
  r.readAsText(file);
}

render();
</script>
